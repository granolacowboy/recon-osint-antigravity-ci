name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recon-readiness-self-hosted
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, recon-readiness]
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit Python runtime dependencies
        run: python -m pip_audit --requirement requirements.txt --progress-spinner off

      - name: Run backend tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Verify committed OpenAPI contract
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- frontend/openapi.json

  frontend:
    name: Frontend quality gates
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, recon-readiness]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Verify generated API types
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Typecheck generated API contract consumers
        run: npm run typecheck:api

      - name: Require a frontend test gate
        run: node -e "const p=require('./package.json'); if(!p.scripts?.test) { throw new Error('package.json must define a test script') }"

      - name: Test
        run: npm run test
        env:
          CI: "true"

      - name: Build production bundle
        run: npm run build

  integration:
    name: Real Redis ARQ Neo4j integration
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, recon-readiness]
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: "recon-ci-${{ github.run_id }}-${{ github.run_attempt }}-integration"
      RUN_REAL_INTEGRATION: "1"
      INTEGRATION_REDIS_PORT: "16379"
      INTEGRATION_REDIS_PASSWORD: REPLACE_WITH_RANDOM_REDIS_PASSWORD
      INTEGRATION_NEO4J_URI: bolt://127.0.0.1:17687
      INTEGRATION_NEO4J_PASSWORD: REPLACE_WITH_RANDOM_NEO4J_PASSWORD
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Start pinned integration datastores
        run: >-
          docker compose
          --env-file .env.example
          --file docker-compose.yml
          --file docker-compose.integration.yml
          up --detach --wait redis neo4j

      - name: Exercise API through Redis ARQ worker and Neo4j
        run: python -m pytest -q -p no:cacheprovider -m integration tests/test_real_platform_integration.py

      - name: Collect service logs on failure
        if: failure()
        run: >-
          docker compose
          --env-file .env.example
          --file docker-compose.yml
          --file docker-compose.integration.yml
          logs redis neo4j

      - name: Stop integration datastores
        if: always()
        run: >-
          docker compose
          --env-file .env.example
          --file docker-compose.yml
          --file docker-compose.integration.yml
          down --volumes --remove-orphans

  containers:
    name: Full-stack container and browser acceptance
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, recon-readiness]
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: "recon-ci-${{ github.run_id }}-${{ github.run_attempt }}-containers"
      IMAGE_TAG: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python for CI evidence checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Check backend Dockerfile
        run: docker build --check .

      - name: Build backend runtime image
        run: docker build --no-cache --target runtime --tag "recon-osint-api:${IMAGE_TAG}" .

      - name: Build frontend runtime image
        run: >-
          docker build
          --file frontend/Dockerfile
          --no-cache
          --target runtime
          --build-arg VITE_API_URL=http://127.0.0.1:8000
          --tag "recon-osint-frontend:${IMAGE_TAG}"
          .

      - name: Bind reviewed backend VEX to this run image
        run: |
          python scripts/render_openvex.py \
            --source security/recon-api.openvex.json \
            --destination "${RUNNER_TEMP}/recon-api.openvex.json" \
            --product "recon-osint-api:${IMAGE_TAG}"

      - name: Generate backend image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: recon-osint-api:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: recon-osint-api.spdx.json
          artifact-name: recon-osint-api-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Reject fixable critical or high backend image CVEs
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: recon-osint-api:${{ env.IMAGE_TAG }}
          vex: ${{ runner.temp }}/recon-api.openvex.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          cache-db: false
          output-format: json
          output-file: ${{ runner.temp }}/recon-api-grype.json

      - name: Prove the reviewed VEX matched this run image
        run: |
          python scripts/verify_grype_vex.py \
            --report "${RUNNER_TEMP}/recon-api-grype.json" \
            --product "recon-osint-api:${IMAGE_TAG}"

      - name: Generate frontend image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: recon-osint-frontend:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: recon-osint-frontend.spdx.json
          artifact-name: recon-osint-frontend-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Reject fixable critical or high frontend image CVEs
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: recon-osint-frontend:${{ env.IMAGE_TAG }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          cache-db: false
          output-format: table

      - name: Preload pinned datastore images
        run: docker compose --env-file .env.example pull --ignore-buildable redis neo4j

      - name: Start the complete pinned stack
        run: bash ./scripts/start.sh --detach --no-build

      - name: Verify readiness, private datastores, and runtime identities
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null
          curl --fail --silent http://127.0.0.1:4173/healthz >/dev/null
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T worker id -u)" = "10001"
          test "$(docker compose exec -T frontend id -u)" = "101"
          test "$(docker compose exec -T redis id -u)" = "999"
          test "$(docker compose exec -T neo4j id -u)" = "7474"
          if [ "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$(docker compose ps -q redis)")" != "{}" ]; then
            echo "Redis must not publish a host port" >&2
            exit 1
          fi
          if [ "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$(docker compose ps -q neo4j)")" != "{}" ]; then
            echo "Neo4j must not publish a host port" >&2
            exit 1
          fi

      - name: Set up Node.js for browser acceptance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install browser acceptance dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run responsive, state, and accessibility acceptance
        working-directory: frontend
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

      - name: Collect complete stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the complete stack and remove run images
        if: always()
        run: |
          cleanup_status=0
          docker compose down --volumes --remove-orphans || cleanup_status=$?

          if docker image inspect "recon-osint-api:${IMAGE_TAG}" >/dev/null 2>&1; then
            docker image rm --force "recon-osint-api:${IMAGE_TAG}" || {
              image_status=$?
              if [ "$cleanup_status" -eq 0 ]; then
                cleanup_status=$image_status
              fi
            }
          fi

          if docker image inspect "recon-osint-frontend:${IMAGE_TAG}" >/dev/null 2>&1; then
            docker image rm --force "recon-osint-frontend:${IMAGE_TAG}" || {
              image_status=$?
              if [ "$cleanup_status" -eq 0 ]; then
                cleanup_status=$image_status
              fi
            }
          fi

          exit "$cleanup_status"
