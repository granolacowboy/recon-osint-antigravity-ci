name: recon-osint

x-backend-build: &backend-build
  context: .
  target: runtime

x-app-environment: &app-environment
  BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?Set PUBLIC_API_BASE_URL in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  REDIS_SSL: "false"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  AUTH_ENABLED: ${AUTH_ENABLED:-true}
  LOCAL_PRINCIPAL_SUB: ${LOCAL_PRINCIPAL_SUB:-local-development}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
  OIDC_ALGORITHMS: ${OIDC_ALGORITHMS:-["RS256"]}
  OIDC_LEEWAY_SECONDS: ${OIDC_LEEWAY_SECONDS:-30}
  OIDC_JWKS_TIMEOUT_SECONDS: ${OIDC_JWKS_TIMEOUT_SECONDS:-5}
  OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-300}
  OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
  OIDC_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-recon-admin}
  VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
  VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
  VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-}
  VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
  VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
  VITE_OIDC_POST_LOGOUT_URI: ${VITE_OIDC_POST_LOGOUT_URI:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://127.0.0.1:4173"]}
  ALLOW_ACTIVE_SCANNING: ${ALLOW_ACTIVE_SCANNING:-false}
  MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-25}
  MAX_ADAPTERS_PER_SCAN: ${MAX_ADAPTERS_PER_SCAN:-25}
  MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-10}
  MAX_QUEUE_DEPTH: ${MAX_QUEUE_DEPTH:-100}
  MAX_OUTSTANDING_SCANS_PER_PRINCIPAL: ${MAX_OUTSTANDING_SCANS_PER_PRINCIPAL:-10}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-65536}
  WORKER_MAX_TRIES: ${WORKER_MAX_TRIES:-3}
  WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-3600}
  WORKER_HEALTH_INTERVAL_SECONDS: ${WORKER_HEALTH_INTERVAL_SECONDS:-10}
  WORKER_LEASE_HEARTBEAT_SECONDS: ${WORKER_LEASE_HEARTBEAT_SECONDS:-10}
  RUNNING_SCAN_LEASE_SECONDS: ${RUNNING_SCAN_LEASE_SECONDS:-60}
  DISPATCH_SWEEP_SECONDS: ${DISPATCH_SWEEP_SECONDS:-2}
  DEFAULT_TIMEOUT: ${DEFAULT_TIMEOUT:-60}
  PROCESS_TERMINATION_GRACE_SECONDS: ${PROCESS_TERMINATION_GRACE_SECONDS:-2}
  HTTP_MAX_ATTEMPTS: ${HTTP_MAX_ATTEMPTS:-3}
  HTTP_BACKOFF_SECONDS: ${HTTP_BACKOFF_SECONDS:-1}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
  RETENTION_SWEEP_SECONDS: ${RETENTION_SWEEP_SECONDS:-3600}
  SCAN_EVENT_POLL_SECONDS: ${SCAN_EVENT_POLL_SECONDS:-0.5}
  SCAN_EVENT_MAX_SECONDS: ${SCAN_EVENT_MAX_SECONDS:-300}
  SCAN_EVENT_MAX_CONNECTIONS_PER_PRINCIPAL: ${SCAN_EVENT_MAX_CONNECTIONS_PER_PRINCIPAL:-3}
  MAX_AUTHORIZATION_HEADER_BYTES: ${MAX_AUTHORIZATION_HEADER_BYTES:-8192}
  OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:-}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
  ACTIVE_TARGET_ALLOWLIST: ${ACTIVE_TARGET_ALLOWLIST:-[]}
  SHODAN_API_KEY: ${SHODAN_API_KEY:-}

x-app-service: &app-service
  image: recon-osint-api:${IMAGE_TAG:-local}
  build: *backend-build
  env_file:
    - path: .env
      required: false
  environment: *app-environment
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1G
        pids: 256
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  configcheck:
    <<: *app-service
    command: ["python", "/app/scripts/container_checks.py", "validate"]
    restart: "no"
    healthcheck:
      disable: true

  redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$${REDIS_PASSWORD}" > /run/redis/redis.conf
        exec redis-server /run/redis/redis.conf
    user: "999:1000"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    read_only: true
    tmpfs:
      - /run/redis:rw,noexec,nosuid,size=1m,uid=999,gid=1000
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.17-community@sha256:d31525aa50da9215d692e5e824696c63583636398f5f5b60260bb92f94095c70
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_initial_dbms_default__database: ${NEO4J_DATABASE:-neo4j}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    user: "7474:7474"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "username=$${NEO4J_AUTH%%/*}; password=$${NEO4J_AUTH#*/}; NEO4J_USERNAME=\"$$username\" NEO4J_PASSWORD=\"$$password\" cypher-shell -a neo4j://127.0.0.1:7687 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
          pids: 512
    restart: unless-stopped

  api:
    <<: *app-service
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000
    networks:
      - edge
      - backend
    depends_on:
      configcheck:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  worker:
    <<: *app-service
    command: ["arq", "--custom-log-dict", "app.core.logging.ARQ_LOG_CONFIG", "app.worker.WorkerSettings"]
    networks:
      - backend
      - egress
    depends_on:
      configcheck:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/scripts/container_checks.py", "worker"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 512

  frontend:
    image: recon-osint-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${PUBLIC_API_BASE_URL:?Set PUBLIC_API_BASE_URL in .env}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
        VITE_OIDC_POST_LOGOUT_URI: ${VITE_OIDC_POST_LOGOUT_URI:-}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-4173}:8080
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 128
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
  egress:

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
